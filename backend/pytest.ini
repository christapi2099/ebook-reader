; Pytest configuration for the backend suite.
;
; Why this file exists (and why it is not in pyproject.toml)
; ---------------------------------------------------------
; ``pytest.ini`` takes precedence over ``[tool.pytest.ini_options]`` in
; pyproject.toml, and backend/pyproject.toml is owned by the uv migration.
; Everything pytest needs therefore lives here and this file must stay
; self-sufficient: the settings that used to sit in pyproject.toml
; (asyncio_mode, testpaths) are repeated below.
;
; Running the suite
; -----------------
; Prefer the selective runner, which adds hard timeouts and a quiet summary:
;
;     ./scripts/test.sh fast            # curated fast subset   (~45 s)
;     ./scripts/test.sh backend tests/test_tts_engine.py
;     ./scripts/test.sh full            # everything, per-suite timeout
;
; Two files are genuinely slow (~2-4 min between them) because they run real
; spaCy NLP over a whole 3.7 MB book, once per test:
;     tests/test_pdf_engine.py       ~9 x 50 s
;     tests/test_epub_ocr_engines.py ~6 x 25 s
; They are excluded from ``fast``; see backend/tests/README.md.

[pytest]
testpaths = tests

# The suite mixes bare `async def test_...` bodies with explicit
# @pytest.mark.asyncio decorators, and the WebSocket fixtures are async.
# `auto` is what the tests were written against; do not change it.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Quiet by default: scripts/test.sh prints only failures plus a summary.
#
#   -q                 one line per file instead of a banner per test
#   --tb=short         tracebacks are the point, 40 lines of fixture noise are not
#   -p no:cacheprovider
#                      no .pytest_cache in the tree. Two agents running pytest
#                      concurrently used to race on it. Consequence: --lf / --ff
#                      are unavailable by design; use ./scripts/test.sh changed.
addopts = -q --tb=short -p no:cacheprovider

# Marker scheme.
#
# IMPORTANT, and deliberately honest: no test currently carries these markers,
# because the test bodies are owned by another change. They are registered here
# so that (a) adding them later needs no config change, and (b) any test that
# does use them produces no "unknown marker" warning under --strict-markers.
# Selection for `fast` therefore uses an explicit file list in scripts/test.sh,
# NOT `-m`. Registering a marker never changes collection on its own.
markers =
    slow: takes > 20 s (real-book NLP, real model load, or deliberate sleeps)
    db: needs a database (in-memory by default; see tests/README.md)
    integration: exercises a real ASGI app / WebSocket through TestClient
    unit: pure logic, no I/O, no model, no database
    realbook: reads a document from ~/Documents/EBooks (filesystem-backed)
    network: may reach the network (e.g. Modal / cloud offload)
