map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Stock nginx mime.types has no .mjs entry, so it falls back to
# application/octet-stream — combined with X-Content-Type-Options: nosniff,
# browsers refuse to execute it as a module (breaks the PDF.js worker).
types {
    application/javascript mjs;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Ebook uploads (PDF/EPUB) routinely exceed nginx's 1MB default.
    client_max_body_size 5g;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy all API/WS/upload traffic to the backend under one namespace,
    # stripping the /api prefix. Bare paths like /library or /voices are also
    # SvelteKit page routes, so they can't be proxied directly without
    # shadowing the SPA's own pages of the same name.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
