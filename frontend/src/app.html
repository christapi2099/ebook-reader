<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script>
			// No-flash theme boot: resolve and set data-theme before first paint.
			(function () {
				try {
					var raw = localStorage.getItem('kokoro-settings');
					var t = raw ? JSON.parse(raw).theme : 'system';
					if (t !== 'light' && t !== 'sepia' && t !== 'dark') t = 'system';
					var resolved = t;
					if (t === 'system') {
						resolved =
							typeof matchMedia === 'function' &&
							matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					}
					document.documentElement.dataset.theme = resolved;
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap"
			/>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
